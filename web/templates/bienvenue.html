<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Bienvenue sur NOKIROVA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('logo') }}">
    <style>
        body {
            background: linear-gradient(135deg, #7ED321, #5BA819);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .bienvenue-box {
            background: white;
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .bienvenue-logo {
            width: 90px; height: 90px;
            border-radius: 22px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .bienvenue-titre {
            font-size: 28px;
            font-weight: 900;
            color: #1A1D2E;
            margin-bottom: 8px;
        }
        .bienvenue-sous {
            color: #6B7280;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .form-bienvenue {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-bienvenue label {
            text-align: left;
            font-weight: 700;
            color: #1A1D2E;
            font-size: 14px;
            margin-bottom: -8px;
        }
        .form-bienvenue input, .form-bienvenue select {
            padding: 14px 18px;
            border: 2px solid #E5E7EB;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            background: white;
        }
        .form-bienvenue input:focus, .form-bienvenue select:focus {
            outline: none;
            border-color: #7ED321;
            box-shadow: 0 0 0 4px rgba(126,211,33,0.15);
        }
        .btn-bienvenue {
            background: linear-gradient(135deg, #7ED321, #5BA819);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(126,211,33,0.35);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-bienvenue:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(126,211,33,0.5);
        }
        .invite-text {
            margin-top: 20px;
            font-size: 12px;
            color: #9CA3AF;
            font-style: italic;
        }
        .login-link {
            margin-top: 15px;
            font-size: 14px;
        }
        .login-link a {
            color: #7ED321;
            text-decoration: none;
            font-weight: 700;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        /* Bouton de visibilité du mot de passe */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            flex: 1;
            padding-right: 50px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #9CA3AF;
            padding: 0;
            line-height: 1;
        }
        .toggle-password:hover {
            color: #1A1D2E;
        }
    </style>
</head>
<body>

<div class="bienvenue-box">
    <img src="{{ url_for('logo') }}" alt="NOKIROVA" class="bienvenue-logo">
    <h1 class="bienvenue-titre">🌸 Bienvenue !</h1>
    <p class="bienvenue-sous">
        Je suis ton professeur intelligent personnel.<br>
        Crée ton compte pour commencer ✨
    </p>

    <form class="form-bienvenue" onsubmit="enregistrerUtilisateur(event)">
        <label for="prenom">👤 Ton prénom</label>
        <input type="text" id="prenom" required placeholder="Ex: Hénoc" maxlength="30">

        <label for="email">📧 Ton email (pour te reconnecter)</label>
        <input type="email" id="email" required placeholder="exemple@email.com">

        <label for="password">🔒 Mot de passe</label>
        <div class="password-wrapper">
            <input type="password" id="password" required placeholder="Au moins 6 caractères" minlength="6">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</button>
        </div>

        <label for="universite">🎓 Ton université (optionnel)</label>
        <input type="text" id="universite" placeholder="Ex: Université Internationale ICK de Bouaké">

        <label for="niveau">📚 Ton niveau d'étude</label>
        <select id="niveau">
            <option value="Lycée">Lycée</option>
            <option value="Licence 1">Licence 1</option>
            <option value="Licence 2">Licence 2</option>
            <option value="Licence 3">Licence 3</option>
            <option value="Master 1">Master 1</option>
            <option value="Master 2">Master 2</option>
            <option value="Doctorat">Doctorat</option>
            <option value="Autre">Autre</option>
        </select>

        <button type="submit" class="btn-bienvenue">🚀 Créer mon compte</button>
    </form>

    <div class="login-link">
        Déjà un compte ? <a href="/login">Se connecter</a>
    </div>

    <p class="invite-text">
        🔒 Tes données sont sécurisées. Connecte-toi pour retrouver tes cours.
    </p>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}

function enregistrerUtilisateur(e) {
    e.preventDefault();
    const prenom = document.getElementById('prenom').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const universite = document.getElementById('universite').value.trim();
    const niveau = document.getElementById('niveau').value;

    if (!prenom) return alert('⚠️ Ton prénom est obligatoire !');
    if (!email) return alert('⚠️ Ton email est obligatoire !');
    if (!password || password.length < 6) return alert('⚠️ Mot de passe (min 6 caractères)');

    // Étape 1 : Créer le compte
    fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, prenom, nom: '' })
    })
    .then(r => r.json())
    .then(async data => {
        if (data.succes) {
            // Étape 2 : Connecter automatiquement pour poser le cookie
            try {
                const loginResponse = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const loginData = await loginResponse.json();
                if (loginData.succes) {
                    localStorage.setItem('nokirova_user', JSON.stringify({
                        user_id: loginData.user_id,
                        email: loginData.email,
                        prenom: loginData.prenom,
                        nom: loginData.nom,
                        universite: universite || 'Non précisé',
                        niveau: niveau,
                        date_creation: new Date().toISOString()
                    }));
                    document.cookie = `nokirova_user_id=${loginData.user_id}; path=/; max-age=31536000`;
                    // Utilisation de replace() pour éviter les boucles
                    window.location.replace('/');
                } else {
                    alert('✅ Compte créé ! Connecte-toi maintenant.');
                    window.location.href = '/login';
                }
            } catch (err) {
                alert('✅ Compte créé ! Une erreur est survenue lors de la connexion automatique.\n\nTu peux te connecter manuellement.');
                window.location.href = '/login';
            }
        } else {
            alert('❌ ' + (data.erreur || 'Erreur création compte'));
        }
    })
    .catch(err => alert('❌ Erreur réseau : ' + err.message));
}

// Si déjà connecté → rediriger
if (localStorage.getItem('nokirova_user')) {
    window.location.replace('/');
}
</script>

</body>
</html>
