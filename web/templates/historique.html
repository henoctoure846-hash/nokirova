{% extends "base.html" %}
{% block title %}Historique - NOKIROVA{% endblock %}
{% block contenu %}
<div class="page-container">

  <div class="page-header" style="background: linear-gradient(135deg, #D8B4FE, #E9D5FF); border-left: 5px solid #A855F7;">
    <div class="page-header-icon" style="background: linear-gradient(135deg, #A855F7, #7B61FF);">📜</div>
    <div>
      <h1 class="page-title" style="color: #6B21A8;">Historique</h1>
      <p class="page-subtitle" style="color: #7E22CE;">Retrouve toutes tes générations IA passées</p>
    </div>
  </div>

  <div class="filtres-bar">
    <select id="filtre-type" onchange="filtrer()">
      <option value="">🌟 Tous les types</option>
      <option value="qcm">🎯 QCM</option>
      <option value="questions">❓ Questions</option>
      <option value="examen">📚 Examen</option>
      <option value="resume">📝 Résumé</option>
      <option value="explication">💡 Explication</option>
      <option value="question_libre">💬 Chat IA</option>
    </select>
    <span id="nb-items" class="badge-nb">0 entrées</span>
    <button onclick="viderTout()" class="btn-clear">🗑️ Tout vider</button>
  </div>

  <div id="liste-historique"></div>

  <div id="empty-state" class="empty-state" style="display:none;">
    <div style="font-size:4rem;">📭</div>
    <h2>Aucun historique</h2>
    <p>Commence à utiliser l'IA pour voir tes générations ici !</p>
  </div>
</div>

<style>
  .page-container { padding:2rem; max-width:1100px; margin:0 auto;}
  .page-header { display:flex; align-items:center; gap:1.2rem; border-radius:20px; padding:1.5rem 2rem; margin-bottom:1.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.05);}
  .page-header-icon { width:60px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:white;}
  .page-title { font-size:1.6rem; font-weight:800; margin:0;}
  .page-subtitle { margin:0.2rem 0 0; font-size:0.95rem;}

  .filtres-bar { display:flex; gap:0.8rem; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center; background:white; padding:1rem; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,0.05);}
  .filtres-bar select { padding:0.7rem 1rem; border:2px solid #D8B4FE; border-radius:12px; font-size:0.9rem; outline:none;}
  .badge-nb { background:#A855F7; color:white; font-weight:700; padding:0.4rem 1rem; border-radius:20px; font-size:0.85rem;}
  .btn-clear { background:#FEE2E2; color:#EF4444; border:2px solid #EF4444; padding:0.6rem 1.2rem; border-radius:12px; font-weight:600; cursor:pointer; margin-left:auto;}
  .btn-clear:hover { background:#EF4444; color:white;}

  .histo-card { background:white; border-radius:16px; padding:1.3rem; margin-bottom:1rem; box-shadow:0 4px 15px rgba(0,0,0,0.06); border-left:5px solid #A855F7;}
  .histo-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.8rem; flex-wrap:wrap; gap:0.5rem;}
  .histo-type { background:linear-gradient(135deg, #A855F7, #7B61FF); color:white; font-weight:700; font-size:0.75rem; padding:0.3rem 0.9rem; border-radius:20px; text-transform:uppercase;}
  .histo-date { color:#9CA3AF; font-size:0.85rem;}
  .histo-question { font-weight:700; color:#374151; margin-bottom:0.5rem; font-size:0.95rem;}
  .histo-reponse { color:#6B7280; font-size:0.9rem; line-height:1.5; max-height:80px; overflow:hidden; position:relative;}
  .histo-reponse.expanded { max-height:none;}
  .histo-actions { margin-top:0.8rem; display:flex; gap:0.5rem; flex-wrap:wrap;}
  .btn-mini { padding:0.4rem 0.9rem; border-radius:10px; font-size:0.8rem; font-weight:600; cursor:pointer; border:2px solid transparent;}
  .btn-voir { background:#EDE9FE; color:#7B61FF; border-color:#7B61FF;}
  .btn-voir:hover { background:#7B61FF; color:white;}
  .btn-sup { background:#FEE2E2; color:#EF4444; border-color:#EF4444;}
  .btn-sup:hover { background:#EF4444; color:white;}

  .empty-state { text-align:center; padding:4rem 2rem; background:white; border-radius:20px; box-shadow:0 4px 20px rgba(0,0,0,0.05);}
  .empty-state h2 { color:#374151; margin:1rem 0 0.5rem;}
  .empty-state p { color:#9CA3AF;}

  .icone-type-qcm { background:linear-gradient(135deg, #FF6B9D, #C2185B);}
  .icone-type-questions { background:linear-gradient(135deg, #2962FF, #1E40AF);}
  .icone-type-examen { background:linear-gradient(135deg, #F59E0B, #B45309);}
  .icone-type-resume { background:linear-gradient(135deg, #2962FF, #7EC8FF);}
  .icone-type-explication { background:linear-gradient(135deg, #FFD93D, #F59E0B);}
  .icone-type-question_libre { background:linear-gradient(135deg, #7B61FF, #A855F7);}
</style>

<script>
let tousItems = [];
const emojis = {
  qcm:'🎯', questions:'❓', examen:'📚', resume:'📝',
  explication:'💡', question_libre:'💬'
};

document.addEventListener('DOMContentLoaded', charger);

function charger() {
  fetch('/api/historique/liste').then(r=>r.json()).then(d=>{
    tousItems = d.items || [];
    afficher(tousItems);
  });
}

function afficher(items) {
  const c = document.getElementById('liste-historique');
  const empty = document.getElementById('empty-state');
  c.innerHTML = '';
  document.getElementById('nb-items').textContent = items.length + ' entrées';

  if (!items || items.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'histo-card';
    const emoji = emojis[it.type] || '📌';
    card.innerHTML = `
      <div class="histo-header">
        <span class="histo-type icone-type-${esc(it.type)}">${emoji} ${esc(it.type)}</span>
        <span class="histo-date">📅 ${esc(it.date)}</span>
      </div>
      <div class="histo-question">❓ ${esc(it.question.substring(0, 150))}${it.question.length>150?'...':''}</div>
      <div class="histo-reponse" id="rep-${it.id}">${esc(it.reponse)}</div>
      <div class="histo-actions">
        <button class="btn-mini btn-voir" onclick="toggleVoir(${it.id})">👁️ Voir plus</button>
        <button class="btn-mini btn-voir" onclick="copier(${it.id})">📋 Copier</button>
        <button class="btn-mini btn-sup" onclick="supprimer(${it.id})">🗑️ Supprimer</button>
      </div>
    `;
    c.appendChild(card);
  });
}

function filtrer() {
  const t = document.getElementById('filtre-type').value;
  if (!t) afficher(tousItems);
  else afficher(tousItems.filter(i=>i.type === t));
}

function toggleVoir(id) {
  document.getElementById('rep-'+id).classList.toggle('expanded');
}

function copier(id) {
  const item = tousItems.find(i=>i.id === id);
  if (item) navigator.clipboard.writeText(item.reponse).then(()=>alert('✅ Copié !'));
}

function supprimer(id) {
  if (!confirm('🗑️ Supprimer cette entrée ?')) return;
  fetch('/api/historique/supprimer/'+id, {method:'DELETE'}).then(r=>r.json()).then(d=>{
    if (d.succes) charger();
  });
}

function viderTout() {
  if (!confirm('⚠️ VIDER TOUT L\'HISTORIQUE ? (irréversible)')) return;
  fetch('/api/historique/vider', {method:'DELETE'}).then(r=>r.json()).then(d=>{
    if (d.succes) charger();
  });
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
</script>
{% endblock %}
