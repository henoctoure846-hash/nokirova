{% extends "base.html" %}

{% block title %}📝 Inscription - NOKIROVA{% endblock %}

{% block contenu %}

<div class="register-page">
  <div class="register-card">
    <div class="register-header">
      <div class="register-logo">🌸</div>
      <h1>Créer un compte</h1>
      <p>Rejoins NOKIROVA et réussis tes examens !</p>
    </div>

    <form id="registerForm">
      <div class="input-group">
        <label>📧 Email</label>
        <input type="email" id="email" placeholder="ton.email@exemple.com" required>
      </div>

      <div class="input-group">
        <label>👤 Prénom</label>
        <input type="text" id="prenom" placeholder="Ton prénom" required>
      </div>

      <div class="input-group">
        <label>📛 Nom</label>
        <input type="text" id="nom" placeholder="Ton nom">
      </div>

      <div class="input-group">
        <label>🔒 Mot de passe</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Au moins 6 caractères" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</button>
        </div>
      </div>

      <div class="input-group">
        <label>🔒 Confirmer mot de passe</label>
        <div class="password-wrapper">
          <input type="password" id="confirm" placeholder="Retape ton mot de passe" required>
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-register">🎉 S'inscrire</button>
    </form>

    <div class="register-footer">
      <p>Déjà un compte ? <a href="/login">Se connecter</a></p>
    </div>
  </div>
</div>

<style>
.register-page {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.register-card {
  max-width: 480px;
  width: 100%;
  background: white;
  border-radius: 32px;
  padding: 40px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  animation: fadeInUp 0.5s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.register-header {
  text-align: center;
  margin-bottom: 30px;
}
.register-logo {
  font-size: 60px;
  margin-bottom: 15px;
}
.register-header h1 {
  font-size: 28px;
  color: #1A1D2E;
  margin-bottom: 8px;
}
.register-header p {
  color: #6B7280;
  font-size: 14px;
}
.input-group {
  margin-bottom: 18px;
}
.input-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: #1A1D2E;
  font-size: 14px;
}
.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #E5E7EB;
  border-radius: 16px;
  font-size: 14px;
  transition: all 0.3s;
}
.input-group input:focus {
  outline: none;
  border-color: #7B61FF;
  box-shadow: 0 0 0 3px rgba(123,97,255,0.1);
}
/* Wrapper pour le bouton œil */
.password-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.password-wrapper input {
  flex: 1;
  padding-right: 50px;
}
.toggle-password {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  color: #9CA3AF;
  padding: 0;
  line-height: 1;
}
.toggle-password:hover {
  color: #1A1D2E;
}
.btn-register {
  width: 100%;
  background: linear-gradient(135deg, #00C853, #059669);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 10px;
}
.btn-register:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 20px rgba(0,200,83,0.4);
}
.register-footer {
  text-align: center;
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #F3F4F6;
}
.register-footer a {
  color: #00C853;
  text-decoration: none;
  font-weight: 600;
}
.register-footer a:hover {
  text-decoration: underline;
}
html[data-mode="sombre"] .register-card {
  background: #2A2D3E;
}
html[data-mode="sombre"] .register-header h1 {
  color: #F1F5F9;
}
html[data-mode="sombre"] .input-group label {
  color: #F1F5F9;
}
html[data-mode="sombre"] .input-group input {
  background: #1A1D2E;
  border-color: #3A3D4E;
  color: #F1F5F9;
}
</style>

<script>
// Fonction pour afficher/masquer le mot de passe
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const prenom = document.getElementById('prenom').value;
  const nom = document.getElementById('nom').value;
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password !== confirm) {
    alert('❌ Les mots de passe ne correspondent pas');
    return;
  }

  if (password.length < 6) {
    alert('❌ Le mot de passe doit faire au moins 6 caractères');
    return;
  }

  const btn = document.querySelector('.btn-register');
  btn.disabled = true;
  btn.textContent = '⏳ Inscription...';

  try {
    // Étape 1 : Créer le compte
    const registerResponse = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, prenom, nom, password })
    });

    const registerData = await registerResponse.json();

    if (!registerData.succes) {
      alert('❌ ' + registerData.erreur);
      btn.disabled = false;
      btn.textContent = '🎉 S\'inscrire';
      return;
    }

    // Étape 2 : Connecter automatiquement le nouvel utilisateur
    const loginResponse = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const loginData = await loginResponse.json();

    if (loginData.succes) {
      // Stocker les infos utilisateur dans le localStorage
      localStorage.setItem('nokirova_user', JSON.stringify({
        user_id: loginData.user_id,
        email: loginData.email,
        prenom: loginData.prenom,
        nom: loginData.nom
      }));

      // Poser le cookie nokirova_user_id
      document.cookie = `nokirova_user_id=${loginData.user_id}; path=/; max-age=31536000`;

      // Rediriger vers l'accueil
      window.location.href = '/';
    } else {
      alert('✅ Compte créé ! Connecte-toi maintenant.');
      window.location.href = '/login';
    }
  } catch (err) {
    alert('❌ Erreur réseau : ' + err.message);
    btn.disabled = false;
    btn.textContent = '🎉 S\'inscrire';
  }
});
</script>

{% endblock %}
