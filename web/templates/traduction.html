{% extends "base.html" %}
{% block title %}Traduction - NOKIROVA{% endblock %}
{% block contenu %}
<div class="page-container">

  <div class="page-header" style="background: linear-gradient(135deg, #7EC8FF, #A5D8FF); border-left: 5px solid #2962FF;">
    <div class="page-header-icon" style="background: linear-gradient(135deg, #2962FF, #7EC8FF);">🌍</div>
    <div>
      <h1 class="page-title" style="color: #1E40AF;">Traduction</h1>
      <p class="page-subtitle" style="color: #2962FF;">Traduis n'importe quel texte en quelques secondes ✨</p>
    </div>
  </div>

  <div class="trad-grid">
    <!-- ZONE SOURCE -->
    <div class="trad-box">
      <div class="trad-header">
        <select id="langue-source" class="select-langue">
          <option value="auto">🌐 Détection auto</option>
          <option value="français">🇫🇷 Français</option>
          <option value="anglais">🇬🇧 Anglais</option>
          <option value="espagnol">🇪🇸 Espagnol</option>
          <option value="allemand">🇩🇪 Allemand</option>
          <option value="italien">🇮🇹 Italien</option>
          <option value="portugais">🇵🇹 Portugais</option>
          <option value="arabe">🇸🇦 Arabe</option>
          <option value="chinois">🇨🇳 Chinois</option>
          <option value="japonais">🇯🇵 Japonais</option>
          <option value="russe">🇷🇺 Russe</option>
        </select>
        <button onclick="effacerSource()" class="btn-clear-mini">✖</button>
      </div>
      <textarea id="texte-source" placeholder="✍️ Écris ou colle ton texte ici..." rows="10"></textarea>
      <div class="trad-footer">
        <span id="compteur-source">0 caractères</span>
        <button onclick="utiliserCours()" class="btn-mini-action">📚 Utiliser mon cours</button>
      </div>
    </div>

    <!-- BOUTON CENTRAL -->
    <div class="trad-center">
      <button onclick="inverser()" class="btn-inverser" title="Inverser les langues">⇄</button>
      <button onclick="traduire()" id="btn-traduire" class="btn-traduire">🌍 Traduire</button>
    </div>

    <!-- ZONE CIBLE -->
    <div class="trad-box">
      <div class="trad-header">
        <select id="langue-cible" class="select-langue">
          <option value="anglais">🇬🇧 Anglais</option>
          <option value="français">🇫🇷 Français</option>
          <option value="espagnol">🇪🇸 Espagnol</option>
          <option value="allemand">🇩🇪 Allemand</option>
          <option value="italien">🇮🇹 Italien</option>
          <option value="portugais">🇵🇹 Portugais</option>
          <option value="arabe">🇸🇦 Arabe</option>
          <option value="chinois">🇨🇳 Chinois</option>
          <option value="japonais">🇯🇵 Japonais</option>
          <option value="russe">🇷🇺 Russe</option>
        </select>
        <button onclick="copierTraduction()" class="btn-clear-mini" title="Copier">📋</button>
      </div>
      <textarea id="texte-cible" placeholder="✨ La traduction apparaîtra ici..." rows="10" readonly></textarea>
      <div class="trad-footer">
        <span id="compteur-cible">0 caractères</span>
        <button onclick="telecharger()" class="btn-mini-action">💾 Télécharger</button>
      </div>
    </div>
  </div>

  <div id="loading" class="loading-card" style="display:none;">
    <div class="spinner"></div>
    <p style="color:#1E40AF; font-weight:700;">🌍 Traduction en cours...</p>
  </div>
</div>

<style>
  .page-container { padding:2rem; max-width:1200px; margin:0 auto;}
  .page-header { display:flex; align-items:center; gap:1.2rem; border-radius:20px; padding:1.5rem 2rem; margin-bottom:1.5rem; box-shadow:0 4px 20px rgba(0,0,0,0.05);}
  .page-header-icon { width:60px; height:60px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:white;}
  .page-title { font-size:1.6rem; font-weight:800; margin:0;}
  .page-subtitle { margin:0.2rem 0 0; font-size:0.95rem;}

  .trad-grid { display:grid; grid-template-columns:1fr auto 1fr; gap:1rem; align-items:stretch;}
  .trad-box { background:white; border-radius:18px; padding:1.2rem; box-shadow:0 4px 20px rgba(0,0,0,0.06); border-top:4px solid #2962FF; display:flex; flex-direction:column;}
  .trad-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; gap:0.5rem;}
  .select-langue { flex:1; padding:0.6rem 0.8rem; border:2px solid #A5D8FF; border-radius:10px; font-size:0.9rem; background:#EFF6FF; color:#1E40AF; font-weight:600; outline:none; cursor:pointer;}
  .select-langue:focus { border-color:#2962FF;}
  .btn-clear-mini { background:#FEE2E2; color:#EF4444; border:none; width:36px; height:36px; border-radius:10px; cursor:pointer; font-weight:700; font-size:1rem; transition:0.2s;}
  .btn-clear-mini:hover { background:#EF4444; color:white;}

  textarea { width:100%; padding:1rem; border:2px solid #D0EBFF; border-radius:12px; font-size:0.95rem; line-height:1.6; resize:vertical; outline:none; font-family:inherit; flex:1; min-height:200px;}
  textarea:focus { border-color:#2962FF;}
  textarea[readonly] { background:#F9FAFB; color:#1E40AF;}

  .trad-footer { display:flex; justify-content:space-between; align-items:center; margin-top:0.7rem; font-size:0.8rem; color:#9CA3AF;}
  .btn-mini-action { background:#EFF6FF; color:#1E40AF; border:2px solid #2962FF; padding:0.3rem 0.8rem; border-radius:8px; font-size:0.78rem; font-weight:600; cursor:pointer;}
  .btn-mini-action:hover { background:#2962FF; color:white;}

  .trad-center { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:1rem; padding:0 0.5rem;}
  .btn-inverser { background:#A5D8FF; color:#1E40AF; border:none; width:50px; height:50px; border-radius:50%; font-size:1.5rem; cursor:pointer; font-weight:700; box-shadow:0 4px 12px rgba(165,216,255,0.4); transition:0.2s;}
  .btn-inverser:hover { transform:rotate(180deg); background:#2962FF; color:white;}
  .btn-traduire { background:linear-gradient(135deg, #2962FF, #1E40AF); color:white; border:none; padding:1rem 1.5rem; border-radius:14px; font-weight:700; font-size:0.95rem; cursor:pointer; box-shadow:0 4px 15px rgba(41,98,255,0.4); writing-mode:vertical-lr; transform:rotate(180deg);}
  .btn-traduire:hover { transform:rotate(180deg) translateY(-2px);}
  .btn-traduire:disabled { background:#D1D5DB; cursor:not-allowed;}

  .loading-card { display:flex; align-items:center; gap:1.5rem; justify-content:center; background:#D0EBFF; border-radius:20px; padding:2rem; margin-top:1rem; border:2px solid #A5D8FF;}
  .spinner { width:40px; height:40px; border:4px solid #A5D8FF; border-top:4px solid #2962FF; border-radius:50%; animation:spin 1s linear infinite;}
  @keyframes spin { to { transform:rotate(360deg);}}

  @media (max-width: 900px) {
    .trad-grid { grid-template-columns:1fr;}
    .btn-traduire { writing-mode:initial; transform:none;}
    .btn-traduire:hover { transform:translateY(-2px);}
    .trad-center { flex-direction:row;}
  }
</style>

<script>
const ts = document.getElementById('texte-source');
const tc = document.getElementById('texte-cible');

ts.addEventListener('input', ()=>{
  document.getElementById('compteur-source').textContent = ts.value.length + ' caractères';
});

function inverser() {
  const ls = document.getElementById('langue-source');
  const lc = document.getElementById('langue-cible');
  if (ls.value === 'auto') { alert('⚠️ Sélectionne une langue source d\'abord !'); return; }
  const temp = ls.value;
  ls.value = lc.value;
  lc.value = temp;
  const tmp = ts.value; ts.value = tc.value; tc.value = tmp;
  document.getElementById('compteur-source').textContent = ts.value.length + ' caractères';
  document.getElementById('compteur-cible').textContent = tc.value.length + ' caractères';
}

function effacerSource() {
  ts.value = '';
  document.getElementById('compteur-source').textContent = '0 caractères';
}

function utiliserCours() {
  fetch('/api/cours/contenu').then(r=>r.json()).then(d=>{
    if (d.succes && d.contenu) {
      ts.value = d.contenu.substring(0, 5000);
      document.getElementById('compteur-source').textContent = ts.value.length + ' caractères';
    } else {
      alert('⚠️ Aucun cours chargé. Va sur Import d\'abord !');
    }
  });
}

function traduire() {
  const source = ts.value.trim();
  if (!source) { alert('⚠️ Écris quelque chose à traduire !'); return; }
  const lSource = document.getElementById('langue-source').value;
  const lCible = document.getElementById('langue-cible').value;

  document.getElementById('loading').style.display = 'flex';
  document.getElementById('btn-traduire').disabled = true;

  fetch('/api/traduction', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({texte: source, langue_source: lSource, langue_cible: lCible})
  })
  .then(r=>r.json())
  .then(d=>{
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-traduire').disabled = false;
    if (d.succes) {
      tc.value = d.traduction;
      document.getElementById('compteur-cible').textContent = tc.value.length + ' caractères';
    } else {
      alert('❌ ' + d.erreur);
    }
  })
  .catch(e=>{
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-traduire').disabled = false;
    alert('❌ ' + e.message);
  });
}

function copierTraduction() {
  if (!tc.value) { alert('⚠️ Rien à copier !'); return; }
  navigator.clipboard.writeText(tc.value).then(()=>alert('✅ Copié !'));
}

function telecharger() {
  if (!tc.value) { alert('⚠️ Rien à télécharger !'); return; }
  const blob = new Blob([tc.value], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Traduction_NOKIROVA.txt';
  a.click();
}
</script>
{% endblock %}
